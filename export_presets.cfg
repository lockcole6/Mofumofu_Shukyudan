[preset.0]

name="Web"
platform="Web"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="data/*.json"
exclude_filter="tools/*"
export_path="build/web/index.html"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include="<meta name=\"theme-color\" content=\"#0c0f1d\"><style>html,body,canvas{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:none;}</style><script>window.addEventListener('contextmenu',function(e){e.preventDefault();});(function(){var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;var list=[];var W=function(o){var c=o===undefined?new AC():new AC(o);list.push(c);return c;};W.prototype=AC.prototype;window.AudioContext=W;if(window.webkitAudioContext)window.webkitAudioContext=W;var sync=function(){list.forEach(function(c){if(document.hidden){if(c.state==='running'){c.__paused=true;c.suspend();}}else if(c.__paused){c.__paused=false;c.resume();}});};document.addEventListener('visibilitychange',sync);window.addEventListener('pagehide',sync);})();</script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
